services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    command: php artisan serve --host=0.0.0.0 --port=8000
    expose: ["8000"]
    depends_on: { mysql: { condition: service_healthy } }
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8000:80"]
    volumes: [".:/var/www/html:ro", "./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
  queue:
    build: .
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work --sleep=3 --tries=1 --max-time=3600
    depends_on: { mysql: { condition: service_healthy } }
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: sh -c 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
    depends_on: { mysql: { condition: service_healthy } }
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-karlancer}
      MYSQL_USER: ${DB_USERNAME:-karlancer}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root-local-only}
    volumes: ["mysql_data:/var/lib/mysql"]
    expose: ["3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 10s, timeout: 5s, retries: 10 }
volumes: { mysql_data: }
